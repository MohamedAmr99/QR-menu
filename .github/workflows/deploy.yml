name: Deploy

# Deploys the Firestore rules, indexes and both sites (dashboard and menu) to the real
# project after every merge to main. Works on the free Spark plan: no Functions, no Storage. Needs the FIREBASE_SERVICE_ACCOUNT secret and the
# VITE_FIREBASE_* repository variables (see docs/DEPLOY.md); skips until they exist.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Skip until the service account secret is added
        if: env.HAS_KEY != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT secret is not set; nothing deployed."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_KEY == 'true'
        run: npm ci
      - name: Build
        if: env.HAS_KEY == 'true'
        run: npm run build
        env:
          # The web config below is public (it ships in every page); repository variables override it.
          VITE_USE_EMULATORS: 'false'
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || 'AIzaSyAJ6Xp_62PQimetkiOFM2kQ49_lU0w8GUg' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'qr-menu-c0167.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: qr-menu-c0167
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || '1:780075193590:web:7aaf5b5cf11d01a4cc48d7' }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ vars.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ vars.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_MENU_BASE_URL: ${{ vars.VITE_MENU_BASE_URL || 'https://qrmenu-c0167.web.app' }}
      - uses: google-github-actions/auth@v2
        if: env.HAS_KEY == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy
        if: env.HAS_KEY == 'true'
        run: npx firebase deploy --project prod --only firestore,hosting --force --non-interactive
